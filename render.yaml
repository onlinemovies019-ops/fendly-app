services:
  - type: web
    name: fendly-api
    runtime: python
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: IMAGE_MATCHING_FUNCTION_URL
        value: https://us-central1-fendly-6d746.cloudfunctions.net/matchReportImages
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://fendly-api.onrender.com
      - key: ADMIN_FIREBASE_UIDS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TRANSLATION_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TRANSLATION_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_OTP_TEMPLATE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-latest
      - key: PUBLIC_BASE_URL
        value: https://fendly-api.onrender.com
      - key: UPLOAD_DIR
        value: static/uploads
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    plan: free
